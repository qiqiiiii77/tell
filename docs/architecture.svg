ca Neue, Arial, sans-serif" font-size="14" font-weight="bold" fill="#6d1f2b" text-anchor="middle" dominant-baseline="middle">fact</text></g><text x="315.5" y="787.7" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#64748b" text-anchor="middle" dominant-baseline="middle">The Voice Agent API owns the conversation. Streaming STT v3 owns the measurement. Neither</text><text x="315.5" y="806.45" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#64748b" text-anchor="middle" dominant-baseline="middle">can write to the record without the other.</text></svg>